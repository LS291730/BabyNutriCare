name: Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:    # 支持手动触发

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配置 JDK 17（不启用gradle缓存，避免与setup-gradle缓存冲突）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. 确认 Android SDK 环境
      - name: Show Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME
          ls $ANDROID_HOME/platforms 2>/dev/null || echo "no platforms dir"

      # 4. 配置 Gradle 8.5（禁用全部缓存，避免损坏的缓存目录被复用）
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
          cache-disabled: true

      # 5. 指定 Android SDK 路径
      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties

      # 6. 清理Gradle解析缓存（resolution result损坏是根因）
      - name: Clean Gradle Caches
        run: rm -rf ~/.gradle/caches ~/.gradle/.tmp || true

      # 7. 单个Gradle进程完成测试+构建（避免多进程并发访问解析缓存）
      - name: Build and Test
        run: gradle :core:testDebugUnitTest assembleDebug --no-daemon --no-build-cache --max-workers=2 --stacktrace
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      # 7. 上传 APK 到构建产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BabyNutriCare-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      # 8. 上传测试报告（构建失败时便于排查）
      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: core/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

